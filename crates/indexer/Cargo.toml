[package]
name = "aave-watch-indexer"
version = "0.1.0"
edition = "2024"

[dependencies]
aave-watch-protocol = { version = "0.1.0", path = "../protocol" }
anyhow = "1.0.104"
futures = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "query", "gzip"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time"] }
