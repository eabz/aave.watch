[package]
name = "aave-watch-api"
version = "0.1.0"
edition = "2024"

[dependencies]
aave-watch-protocol = { version = "0.1.0", path = "../protocol" }
axum = "0.8.9"
redis = { version = "1.8.2", features = ["tokio-comp", "streams", "connection-manager"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
tokio-stream = "0.1.19"
toml = "1.2.1"
