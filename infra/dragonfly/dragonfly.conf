# Dragonfly flags for the aave.watch server. Install as /etc/dragonfly/dragonfly.conf.
# Dragonfly has no schema: the key and stream names live in crates/protocol/src/keys.rs.
# Everything in it can be rebuilt from the chain and from ClickHouse, so persistence is only there
# to make a restart fast.
--bind=127.0.0.1
--port=6379
--dir=/var/lib/dragonfly
--dbfilename=dump
# snapshot every 5 minutes
--snapshot_cron=*/5 * * * *
# never evict: a missing key must mean "not written", not "dropped"
--cache_mode=false
