# Chains and seed Hubs. Spokes, assets and reserves are discovered on chain from the Hubs.
# Hub addresses: DefiLlama-Adapters projects/aave-v4/index.js, each checked on chain 2026-11-18
# (getAssetCount answers). first_block is the block the contract's code first appears
# (Base: the block of the Hub's first log).
# settle_tag: the block tag a block must reach before it is written to ClickHouse.
# start_block: where the fetcher starts. The block the earliest watched contract was deployed in,
# which is the Treasury Spoke, a few blocks before the first Hub (eth_getCode, 2026-11-18).

